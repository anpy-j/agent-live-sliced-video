[project]
name = "agent-live-sliced-video"
version = "0.1.0"
description = "Observable local agent for live-stream video slicing"
requires-python = ">=3.11"

[project.scripts]
slice-agent = "agent_video.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_video"]

